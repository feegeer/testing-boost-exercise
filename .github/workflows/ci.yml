name: SIDEMADE CI/CD
on: push

jobs:
  style:
    name: Run style check with clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install & run clang-format
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-format
          git ls-files '*.cpp' '*.hpp' | xargs -r clang-format -style=file -n --Werror

  build:
    name: Build the project
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build-type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake build-essential clang \
                                  libboost-all-dev libeigen3-dev libyaml-cpp-dev

      - name: Configure & build
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S . -B build/${{ matrix.compiler }}/${{ matrix.build-type }} \
                -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
                -DCMAKE_CXX_COMPILER="$CXX"
          cmake --build build/${{ matrix.compiler }}/${{ matrix.build-type }} -- -j"$(nproc)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.compiler }}-${{ matrix.build-type }}
          path: build/${{ matrix.compiler }}/${{ matrix.build-type }}
          retention-days: 1

  test:
    name: Run ctest
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build-type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-${{ matrix.compiler }}-${{ matrix.build-type }}
          path: build/${{ matrix.compiler }}/${{ matrix.build-type }}

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake build-essential clang \
                                  libboost-all-dev libeigen3-dev libyaml-cpp-dev

      - name: Make executable again
        run: chmod +x build/${{ matrix.compiler }}/${{ matrix.build-type }}/testsidemade

      - name: Run unit tests
        working-directory: build/${{ matrix.compiler }}/${{ matrix.build-type }}
        run: ctest --output-on-failure
